    .toolbar {

      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .toolbar-title {
      font-size: 15px;
      font-weight: 600;
      color: #E2E8F0;
      letter-spacing: 0.3px;
    }

    .slide-badge {
      background: #334155;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #38BDF8;
    }

    .toolbar-center {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav {
      background: #1E293B;
      color: #E2E8F0;
      border: 1px solid #475569;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-nav:hover {
      background: #334155;
      border-color: #64748B;
    }

    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    select.slide-select {
      background: #1E293B;
      color: #E2E8F0;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-download {
      background: #A51D24;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;

      gap: 6px;

    }

    .btn-download:hover {
      background: #85161C;
    }

    /* Presentation Canvas Area */
    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
      background: #0B1120;
    }

    /* 16:9 Slide Frame */
    .slide-viewport {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      position: relative;
      border-radius: 4px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      background-color: var(--bg-wood);
      background-image: repeating-linear-gradient(0deg, #E4CCA8, #E4CCA8 2px, #DFC59F 3px, #E4CCA8 4px);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Horizontal Dark Ribbon */
    .slide-ribbon {
      position: absolute;
      top: 44%;
      left: 0;
      width: 100%;
      height: 12%;
      background-color: var(--ribbon-dark);
      z-index: 1;
    }

    /* Centered White Card */
    .slide-card {
      position: relative;
      width: 88%;
      height: 86%;
      background-color: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 2px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      z-index: 2;
      padding: 12px;
      display: flex;
      flex-direction: column;

      height: 100%;
      border: 2px solid var(--border-olive);
      padding: 20px 32px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;

      font-size: 24px;
      font-weight: bold;
      color: var(--title-crimson);
      margin-bottom: 6px;

      color: var(--title-dark);
      margin-top: 10px;
      line-height: 1.25;

      font-size: 36px;
      margin-top: 40px;
    }

    .slide-divider {
      width: 100%;
      height: 2px;
      background-color: var(--border-olive);
      margin-bottom: 12px;
    }

    .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      color: var(--text-main);
      font-size: 13px;
      line-height: 1.45;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      height: 100%;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      height: 100%;
    }

    .info-card {
      background: var(--box-bg);

      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;

    .info-card.crimson-tint {
      background: #FEF2F2;
      border-color: #F87171;
    }

    .info-card.green-tint {
      background: #F0FDF4;
      border-color: #86EFAC;
    }

    .info-card.amber-tint {
      background: #FFFBEB;
      border-color: #FCD34D;
    }

    .card-heading {
      font-family: "Georgia", serif;
      font-size: 13px;
      font-weight: bold;
      color: var(--title-crimson);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;

    .card-heading.green { color: #15803D; }
    .card-heading.dark { color: #1E293B; }
    .card-heading.amber { color: #B45309; }

      list-style-type: none;
      padding-left: 0;
    }

    ul.bullet-list li {
      position: relative;
      padding-left: 16px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-main);
    }

    ul.bullet-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--border-olive);
      font-weight: bold;
      font-size: 15px;
      line-height: 1;
    }

    ul.bullet-list.cross li::before {
      content: "❌";
      font-size: 10px;
      left: -2px;
    }

    ul.bullet-list.check li::before {
      content: "✔";
      font-size: 11px;
      color: #15803D;
      left: -2px;
    }

      font-size: 11px;
      font-weight: bold;
      color: var(--border-olive);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;

      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;

    let currentSlide = 0;
    const totalSlides = slidesData.length;

    function renderSlide(index) {
      const data = slidesData[index];
      const frame = document.getElementById('slideFrame');

      if (data.type === 'cover' || data.type === 'section') {
        frame.innerHTML = data.render();
      } else {
        frame.innerHTML = `
          <div class="slide-header">
            <div class="slide-title">${data.title}</div>
            ${data.subtitle ? `<div class="subtitle-tag">${data.subtitle}</div>` : ''}
            <div class="slide-divider"></div>
          </div>
          ${data.render()}
        `;
      }

      document.getElementById('slideIndicator').innerText = `Slide ${index + 1} / ${totalSlides}`;
      document.getElementById('slideSelect').value = index;
      document.getElementById('prevBtn').disabled = (index === 0);
      document.getElementById('nextBtn').disabled = (index === totalSlides - 1);
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function jumpToSlide(val) {
      currentSlide = parseInt(val, 10);
      renderSlide(currentSlide);
    }

    function toggleFullScreen() {
      const el = document.querySelector('.slide-viewport');
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    // Populate Slide Dropdown
    const select = document.getElementById('slideSelect');
    slidesData.forEach((s, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.text = `Slide ${idx + 1}: ${s.title || (s.type === 'cover' ? 'Title Cover' : 'The Project Proposal')}`;
      select.appendChild(opt);
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      }
    });

    // Initial render
    renderSlide(currentSlide);
